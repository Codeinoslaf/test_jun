services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    networks:
      - services_net

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    env_file:
      - ./.env
    ports:
      - "${NGINX_HOST_PORT}:80"
    depends_on:
      - backend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - services_net

networks:
  services_net:
    driver: bridge